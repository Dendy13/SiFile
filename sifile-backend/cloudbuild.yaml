steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'sifile-backend'
    args: ['build', '-t', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sifile-backend:$COMMIT_SHA', '.']
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'sifile-backend'
    args: ['push', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sifile-backend:$COMMIT_SHA']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    dir: 'sifile-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sifile-backend'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sifile-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'FIREBASE_STORAGE_BUCKET=sifile-app.firebasestorage.app'
images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/sifile-backend:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
